<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗺️ Centros docentes de CYL con Javascript y Leaflet</title>

  <!-- 🗺️ Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary: #ba273b;
      --bg: #f9ecee;
    }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: #333;
      text-align: center;
      padding: 1.5rem;
    }
    h1 {
      color: var(--primary);
      margin-bottom: 0.4rem;
    }
    p.subtitle {
      margin-top: 0;
      color: #555;
      margin-bottom: 1.5rem;
    }
    #mapa {
      height: 520px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    footer {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>🗺️ Centros docentes en Castilla y León</h1>
  <p class="subtitle">Ejemplo con JavaScript y la librería Leaflet</p>

  <div id="mapa" aria-label="Mapa de centros docentes"></div>
  <footer>Fuente: Portal de Datos Abiertos de la Junta de Castilla y León</footer>

  <!-- 🗺️ Script de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const CSV_URL = "./directorio-de-centros-docentes.csv";

    // 1️⃣ Cargar y parsear el CSV
    async function cargarCSV() {
      const res = await fetch(CSV_URL);
      const texto = await res.text();

      // Detecta el separador automáticamente
      const primera = texto.split(/\r?\n/)[0];
      const sep = (primera.split(";").length > primera.split(",").length) ? ";" : ",";

      const lineas = texto.trim().split(/\r?\n/);
      const cabeceras = lineas.shift().split(sep).map(c => c.trim());

      return lineas.map(linea => {
        const valores = linea.split(sep).map(v => v.replace(/^"|"$/g, "").trim());
        return Object.fromEntries(cabeceras.map((c, i) => [c, valores[i] ?? ""]));
      });
    }

    // 2️⃣ Inicializar el mapa centrado en Castilla y León
    function initMapa() {
      const mapa = L.map("mapa").setView([41.65, -4.72], 7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(mapa);
      return mapa;
    }

    // 3️⃣ Dibujar los centros docentes en el mapa
    function dibujarCentros(mapa, centros) {
      // Detectar las claves de coordenadas y campos relevantes
      const latKey = Object.keys(centros[0]).find(k => /lat/i.test(k));
      const lonKey = Object.keys(centros[0]).find(k => /lon/i.test(k));
      const nombreKey = Object.keys(centros[0]).find(k => /denominaci/i.test(k) || /nombre/i.test(k));
      const muniKey = Object.keys(centros[0]).find(k => /munic/i.test(k));
      const provKey = Object.keys(centros[0]).find(k => /provin/i.test(k));
      const tipoKey = Object.keys(centros[0]).find(k => /tipo/i.test(k));

      let contador = 0;

      centros.forEach(c => {
        const lat = parseFloat(c[latKey]);
        const lon = parseFloat(c[lonKey]);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

        contador++;

        const popup = `
          <strong>${c[nombreKey] || "Centro sin nombre"}</strong><br>
          ${c[muniKey] || ""} (${c[provKey] || ""})<br>
          Tipo: ${c[tipoKey] || "—"}
        `;

        L.marker([lat, lon]).addTo(mapa).bindPopup(popup);
      });

      console.log(`Marcadores añadidos: ${contador}`);
    }

    // 4️⃣ Ejecutar todo
    (async () => {
      try {
        const datos = await cargarCSV();
        const mapa = initMapa();
        dibujarCentros(mapa, datos);
      } catch (err) {
        console.error("❌ Error al cargar el CSV o mostrar el mapa:", err);
        alert("No se pudo cargar el mapa. Revisa la ruta del CSV o el formato.");
      }
    })();
  </script>
</body>
</html>

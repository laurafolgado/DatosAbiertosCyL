<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Gráfico de uso de redes sociales – Chart.js + Datos Abiertos JCyL</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #ba273b;
      --primary-light: #f8e9ec;
      --bg: #fafafa;
    }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: #333;
      text-align: center;
      padding: 2rem;
    }
    h1 { color: var(--primary); margin-bottom: 0.25rem; }
    p.subtitle { color: #555; margin-bottom: 2rem; }
    #grafico-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      padding: 2rem;
    }
  </style>
</head>
<body>
  <h1>📊 Uso de redes sociales</h1>
  <p class="subtitle">Visualización interactiva con <strong>Chart.js</strong> a partir de datos abiertos de Castilla y León</p>

  <div id="grafico-container">
    <canvas id="grafico"></canvas>
  </div>

  <script>
    async function cargarCSV() {
      const res = await fetch("./estadisticas-de-uso-de-redes-sociales.csv");
      const texto = await res.text();
      const sep = texto.includes(";") ? ";" : ",";
      const lineas = texto.trim().split(/\r?\n/);
      const cabeceras = lineas.shift().split(sep).map(c => c.trim());
      const datos = lineas.map(l => {
        const valores = l.split(sep).map(v => v.replace(/^"|"$/g, "").trim());
        return Object.fromEntries(cabeceras.map((c, i) => [c, valores[i] ?? ""]));
      });
      return datos;
    }

    function detectarColumnas(datos) {
      const columnas = Object.keys(datos[0]);
      const colAno = columnas.find(c => /año|ano/i.test(c)) || columnas[0];
      const colRed = columnas.find(c => /red/i.test(c)) || columnas[1];
      const colPorcentaje = columnas.find(c => /porcentaje/i.test(c)) || columnas[columnas.length - 1];
      return { colAno, colRed, colPorcentaje };
    }

    function agruparPorRed(datos, colRed, colPorcentaje, colAno) {
      const ultimoAno = [...new Set(datos.map(d => d[colAno]))].sort().pop();
      const filtrados = datos.filter(d => d[colAno] === ultimoAno);

      const agrupado = {};
      filtrados.forEach(d => {
        const red = d[colRed].trim();
        const valor = parseFloat(d[colPorcentaje]) || 0;
        agrupado[red] = agrupado[red] ? (agrupado[red] + valor) / 2 : valor;
      });

      const etiquetas = Object.keys(agrupado);
      const valores = Object.values(agrupado);
      return { etiquetas, valores, ano: ultimoAno };
    }

    async function initGrafico() {
      const datos = await cargarCSV();
      const { colAno, colRed, colPorcentaje } = detectarColumnas(datos);
      const { etiquetas, valores, ano } = agruparPorRed(datos, colRed, colPorcentaje, colAno);

      const ctx = document.getElementById("grafico").getContext("2d");

      new Chart(ctx, {
        type: "bar",
        data: {
          labels: etiquetas,
          datasets: [{
            label: `Porcentaje de uso (${ano})`,
            data: valores,
            backgroundColor: "rgba(186, 39, 59, 0.7)",
            borderColor: "#ba273b",
            borderWidth: 1.5,
            borderRadius: 8,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: `Uso de redes sociales (${ano})`,
              color: "#222",
              font: { size: 18, weight: "600" }
            },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.parsed.y.toFixed(1)}%`
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#333", font: { size: 13, weight: "500" } },
              grid: { display: false }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: "#333",
                callback: v => v + "%",
              },
              grid: { color: "#eee" }
            }
          }
        }
      });
    }

    initGrafico();
  </script>
</body>
</html>
